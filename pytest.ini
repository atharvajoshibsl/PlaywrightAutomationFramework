[pytest]
testpaths = tests

# Lets the tests import the framework package without any sys.path juggling.
pythonpath = .

# pytest-base-url turns this into the base_url fixture. Override for a local
# copy with: pytest --base-url http://127.0.0.1:8000
base_url = https://atharvajoshi.pythonanywhere.com

# --clean-alluredir wipes the previous run so a report never mixes two runs.
addopts =
    -v
    --strict-markers
    --alluredir=reports/allure-results
    --clean-alluredir

# Declared so --strict-markers can reject typos. These mirror the Suite column
# in TEST_PLAN.xlsx, so "run the smoke suite" is -m smoke.
markers =
    smoke: minimum confidence that the build is usable
    sanity: focused checks on one changed area
    regression: full functional coverage
